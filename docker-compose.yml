version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: ""
      OPENROUTER_MODEL: ""
      KUBECONFIG_PATH: ""
      DATABASE_URL: "sqlite:///./ai_kubernetes_agent.db"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
    depends_on:
      - backend
